[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riders-pulse-sdk"
version = "0.1.0"
description = "Server-side Python client for Pulse API v1"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[tool.setuptools.package-data]
pulse_sdk = ["py.typed"]

[project.urls]
Source = "https://github.com/riders-agency/pulse-sdk-python"
Documentation = "https://github.com/riders-agency/pulse-open-source/tree/main/sdk/frameworks"
